<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Derived from icon.svg: identical artwork, full-bleed background, content
       scaled about centre to fill a Pixel's circle mask without clipping.

       The artwork's outermost points are the four hexagon corners at (20,30),
       (20,70), (80,30), (80,70) — radius sqrt(30^2+20^2) = 36.0555 from centre.
       So scale = target_radius / 36.0555, and translate = 50*(1-scale).

       Tuned on-device over three rounds, not from the spec:
         0.78    r=28.1  the strict web maskable safe zone (radius 40). Looked
                         obviously undersized on a Pixel — that safe zone is
                         sized for the most aggressive OEM mask shapes, not a
                         plain circle.
         1.38675 r=50.0  tangent to a circle inscribed in the square. Corners
                         came back clearly chopped: the real mask is tighter
                         than the full square, and a sharp vertex reads as
                         clipped even at exact tangency because both edges fall
                         inside the circle right at that point.
         1.30    r=46.9  very tips of the hexagon still caught.
         1.25    r=45.1  current. Clean on-device.

       Bookmark and spine tips only reach r=37.5 here, so the four hexagon
       corners are always the binding constraint. -->
  <defs><linearGradient id="bg-mk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1c24"></stop><stop offset="1" stop-color="#0e1015"></stop></linearGradient></defs>
  <rect width="100" height="100" fill="url(#bg-mk)"></rect>
  <g transform="translate(-12.5,-12.5) scale(1.25)">
    <path d="M20,30 L48,22 L48,78 L20,70 Z" fill="#30343f" stroke="#444956" stroke-width="1.5"></path>
    <rect x="26" y="40" width="16" height="3" rx="1.5" fill="#565b6a"></rect>
    <rect x="26" y="48" width="12" height="3" rx="1.5" fill="#565b6a"></rect>
    <rect x="26" y="56" width="15" height="3" rx="1.5" fill="#565b6a"></rect>
    <path d="M80,30 L52,22 L52,78 L80,70 Z" fill="#30343f" stroke="#444956" stroke-width="1.5"></path>
    <rect x="58" y="36" width="8" height="8" rx="3" fill="#7f8dff"></rect>
    <rect x="70" y="36" width="8" height="8" rx="3" fill="#34d399"></rect>
    <rect x="58" y="48" width="8" height="8" rx="3" fill="#f0a742"></rect>
    <rect x="70" y="48" width="8" height="8" rx="3" fill="none" stroke="#444956" stroke-width="2" stroke-dasharray="2 2"></rect>
    <rect x="48" y="20" width="4" height="60" rx="2" fill="#7f8dff"></rect>
    <path d="M46,20 L54,20 L54,34 L50,28 L46,34 Z" fill="#34d399"></path>
  </g>
</svg>
